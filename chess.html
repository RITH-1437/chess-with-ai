<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Chess vs Computer</title>
    
    <link rel="stylesheet"
      href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
      integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2hBLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU"
      crossorigin="anonymous">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #2c3e50;
            color: white;
            min-height: 100vh;
            margin: 0;
        }

        h1 { margin-bottom: 10px; }

        #board {
            width: 400px;
            margin: 20px;
        }

        .info {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            width: 380px;
        }

        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }

        button:hover { background-color: #2ecc71; }
        
        .status { font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>Chess: You vs Computer</h1>
    <div id="board"></div>
    
    <div class="info">
        <div class="status" id="status">White to move</div>
        <div id="pgn"></div>
        <button id="restartBtn">New Game</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        // Initialize the game logic
        var game = new Chess();
        var $status = $('#status');
        var $pgn = $('#pgn');

        function onDragStart (source, piece, position, orientation) {
            // Do not pick up pieces if the game is over
            if (game.game_over()) return false;

            // Only pick up pieces for White (User)
            if (piece.search(/^b/) !== -1) return false;
        }

        function makeComputerMove () {
            var possibleMoves = game.moves();

            // Game over?
            if (possibleMoves.length === 0) return;

            // --- BASIC AI LOGIC ---
            // Currently selects a random legal move.
            var randomIdx = Math.floor(Math.random() * possibleMoves.length);
            var move = possibleMoves[randomIdx];
            // ----------------------

            game.move(move);
            board.position(game.fen());
            updateStatus();
        }

        function onDrop (source, target) {
            // See if the move is legal
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' // NOTE: Always promote to a queen for simplicity
            });

            // Illegal move
            if (move === null) return 'snapback';

            // Make computer move after a short delay for realism
            window.setTimeout(makeComputerMove, 250);

            updateStatus();
        }

        // Update the board position after the piece snap
        // for castling, en passant, pawn promotion
        function onSnapEnd () {
            board.position(game.fen());
        }

        function updateStatus () {
            var status = '';

            var moveColor = 'White';
            if (game.turn() === 'b') {
                moveColor = 'Black';
            }

            // Checkmate?
            if (game.in_checkmate()) {
                status = 'Game over, ' + moveColor + ' is in checkmate.';
            }
            // Draw?
            else if (game.in_draw()) {
                status = 'Game over, drawn position';
            }
            // Game still on
            else {
                status = moveColor + ' to move';
                // Is player in check?
                if (game.in_check()) {
                    status += ', ' + moveColor + ' is in check';
                }
            }

            $status.text(status);
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            // Use Wikipedia images for the pieces
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };

        board = Chessboard('board', config);

        updateStatus();

        // Restart Button
        $('#restartBtn').on('click', function() {
            game.reset();
            board.start();
            updateStatus();
        });
    </script>
</body>
</html>
