<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Play a responsive chess game against a local AI with legal move validation, timers, hints, move history, and difficulty levels."
  >
  <title>Chess With AI</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
    integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2hBLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="title-block">
      <p class="eyebrow">Chess With AI</p>
      <h1>Play White against a local chess engine</h1>
    </div>

    <div class="game-controls" aria-label="Game controls">
      <label class="control-field" for="aiEngineSelect">
        <span>AI style</span>
        <select id="aiEngineSelect">
          <option value="balanced" selected>Balanced</option>
          <option value="tactical">Tactical</option>
          <option value="defensive">Defensive</option>
        </select>
      </label>

      <label class="control-field" for="difficultySelect">
        <span>Difficulty</span>
        <select id="difficultySelect">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>

      <button id="newGameBtn" class="btn primary" type="button">New Game</button>
      <button id="undoBtn" class="btn" type="button">Undo</button>
      <button id="aiMoveBtn" class="btn" type="button">AI Move</button>
      <button id="hintBtn" class="btn" type="button">Hint</button>
    </div>

    <div id="engineStatus" class="engine-status" role="status" aria-live="polite">
      AI: Balanced - Medium
    </div>
  </header>

  <main class="game-shell">
    <section class="side-panel status-panel" aria-label="Game status">
      <div id="status" class="status" role="status" aria-live="polite">White to move</div>

      <div class="timer-grid">
        <div class="timer active" data-timer="white">
          <span class="timer-label">White</span>
          <span id="whiteTimer" class="timer-display">10:00</span>
        </div>
        <div class="timer" data-timer="black">
          <span class="timer-label">Black AI</span>
          <span id="blackTimer" class="timer-display">10:00</span>
        </div>
      </div>

      <div class="score-card">
        <span>Score</span>
        <strong><span id="whiteScore">0</span> - <span id="blackScore">0</span></strong>
      </div>

      <div class="captured-group">
        <p>Captured white pieces</p>
        <div id="whiteCaptured" class="captured-pieces" aria-label="Captured white pieces"></div>
      </div>

      <div class="captured-group">
        <p>Captured black pieces</p>
        <div id="blackCaptured" class="captured-pieces" aria-label="Captured black pieces"></div>
      </div>
    </section>

    <section class="board-panel" aria-label="Chess board">
      <div class="board-frame">
        <div id="board"></div>
      </div>
      <div class="board-controls">
        <button id="flipBtn" class="btn" type="button">Flip Board</button>
        <button id="soundToggle" class="btn" type="button">Sound On</button>
      </div>
    </section>

    <aside class="side-panel analysis-panel" aria-label="Move history and analysis">
      <section class="panel-section">
        <h2>Move History</h2>
        <div id="moveList" class="move-list" aria-live="polite"></div>
      </section>

      <section class="panel-section">
        <h2>Game Analysis</h2>
        <div id="evaluation" class="evaluation">Even position</div>
        <div id="bestMove" class="best-move" aria-live="polite"></div>
      </section>
    </aside>
  </main>

  <div id="gameOverModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="gameResult">
    <div class="modal-content">
      <h2 id="gameResult">Game over</h2>
      <p id="gameResultMessage"></p>
      <div class="modal-buttons">
        <button id="newGameModalBtn" class="btn primary" type="button">New Game</button>
        <button id="closeModalBtn" class="btn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
